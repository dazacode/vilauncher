name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build for Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup fails when its version and package.json's
      # packageManager disagree, so take packageManager's when it is set.
      - name: Read the pnpm version
        id: pnpm
        run: |
          version=$(node -p "((require('./package.json').packageManager || '').match(/^pnpm@([^+]+)/) || [])[1] || '10'")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Type-check the UI
        run: pnpm exec tsc -b

      # Every language has every message, and no English is left in the UI code (docs/I18N.md).
      - name: Check the translations
        run: pnpm i18n:check

      # The Rust crate embeds dist/ at compile time, so the UI is built before the tests.
      - name: Build the UI
        run: pnpm exec vite build

      - name: Test the launcher
        working-directory: src-tauri
        run: cargo test --locked

      # Optional. Without the secret the build still runs, unsigned; the signing
      # script in tauri.conf.json then does nothing. See docs/FALSE-POSITIVES.md.
      - name: Import the signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host 'No signing certificate is set: this build is unsigned.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          $base64 = $env:WINDOWS_CERTIFICATE -replace '\s', ''
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($base64))
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Remove-Item $pfx
          "VILAUNCHER_SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build the launcher and installer
        run: pnpm tauri build

      - name: Print the SHA-256 digests
        run: sha256sum src-tauri/target/release/VILauncher.exe src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload VILauncher.exe
        uses: actions/upload-artifact@v4
        with:
          name: VILauncher.exe
          path: src-tauri/target/release/VILauncher.exe
          if-no-files-found: error

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: VILauncher-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Read the pnpm version
        id: pnpm
        run: |
          version=$(node -p "((require('./package.json').packageManager || '').match(/^pnpm@([^+]+)/) || [])[1] || '10'")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The WebView and GTK libraries Tauri links against on Linux.
      - name: Install the Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf libssl-dev

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Type-check the UI
        run: pnpm exec tsc -b

      - name: Build the UI
        run: pnpm exec vite build

      - name: Test the launcher
        working-directory: src-tauri
        run: cargo test --locked

      # AppImage tooling runs without FUSE on CI runners when extracted first.
      - name: Build the AppImage and .deb
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm tauri build --bundles appimage,deb

      - name: Print the SHA-256 digests
        run: sha256sum src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb

      - name: Upload the Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: VILauncher-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The release text is this version's section of CHANGELOG.md. The step fails when the
      # section is missing or empty, so a release never goes out without its thanks.
      - name: Take this version's notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          awk -v v="$version" '/^## /{p=($0 == "## " v); next} p' CHANGELOG.md > release/notes.md
          test -s release/notes.md

      - uses: actions/download-artifact@v4
        with:
          name: VILauncher.exe
          path: release/exe

      - uses: actions/download-artifact@v4
        with:
          name: VILauncher-setup
          path: release/installer

      - uses: actions/download-artifact@v4
        with:
          name: VILauncher-linux
          path: release/linux

      # The in-app updater looks for an asset named exactly VILauncher.exe and
      # checks it against the sha256 digest GitHub records for the upload.
      - uses: softprops/action-gh-release@v2
        with:
          name: VILauncher ${{ github.ref_name }}
          body_path: release/notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/exe/VILauncher.exe
            release/installer/*.exe
            release/linux/**/*.AppImage
            release/linux/**/*.deb
