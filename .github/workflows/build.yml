name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build for Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup fails when its version and package.json's
      # packageManager disagree, so take packageManager's when it is set.
      - name: Read the pnpm version
        id: pnpm
        run: |
          version=$(node -p "((require('./package.json').packageManager || '').match(/^pnpm@([^+]+)/) || [])[1] || '10'")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Type-check the UI
        run: pnpm exec tsc -b

      # The Rust crate embeds dist/ at compile time, so the UI is built before the tests.
      - name: Build the UI
        run: pnpm exec vite build

      - name: Test the launcher
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build the launcher and installer
        run: pnpm tauri build

      - name: Upload VILauncher.exe
        uses: actions/upload-artifact@v4
        with:
          name: VILauncher.exe
          path: src-tauri/target/release/VILauncher.exe
          if-no-files-found: error

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: VILauncher-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VILauncher.exe
          path: release/exe

      - uses: actions/download-artifact@v4
        with:
          name: VILauncher-setup
          path: release/installer

      # The in-app updater looks for an asset named exactly VILauncher.exe and
      # checks it against the sha256 digest GitHub records for the upload.
      - uses: softprops/action-gh-release@v2
        with:
          name: VILauncher ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/exe/VILauncher.exe
            release/installer/*.exe
